function recursionUnfolder(el, api) {
  var frames = ["f(3)", "= f(2) + f(2)", "= f(1) + f(1) + f(1) + f(1)",
    "= f(0) + f(0) + f(0) + f(0) + f(0) + f(0) + f(0) + f(0)",
    "= 1 + 1 + 1 + 1 + 1 + 1 + 1 + 1", "= 8"];
  var i = 0;
  el.innerHTML =
    '<div class="r-controls">' +
      '<button class="r-btn" id="ru-next" type="button">Unfold one step</button>' +
      '<button class="r-btn ghost" id="ru-reset" type="button">Reset</button>' +
      '<span class="r-stat">step <b id="ru-step" style="display:inline">0</b></span>' +
    '</div><div class="r-frame" id="ru-frame"></div>' +
    '<p style="font-size:14px;color:var(--r-muted);margin:.6rem 0 0">Each step uses the successor equation f(n+1) = f(n) + f(n). Unfolding reverses one successor at a time until it reaches the base 0.</p>';
  var frame = el.querySelector("#ru-frame"), stepOut = el.querySelector("#ru-step");
  function draw() { frame.innerHTML = frames.slice(0, i + 1).join("<br>"); stepOut.textContent = i; }
  el.querySelector("#ru-next").onclick = function () { if (i < frames.length - 1) i++; draw(); };
  el.querySelector("#ru-reset").onclick = function () { i = 0; draw(); };
  draw();
}
