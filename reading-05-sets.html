      "<p>The product $n(n-1)(n-2)\\cdots2\\cdot1$ occurs whenever all $n$ objects are arranged in order. We abbreviate it by $n!$, read &ldquo;$n$ factorial.&rdquo; For example, $5!=5\\cdot4\\cdot3\\cdot2\\cdot1=120$.</p>" +
      "<p>Often we fill only $r$ positions using $n$ available objects. The first position has $n$ options, the next has $n-1$, and the $r$th position has $n-r+1$. This gives a descending product of exactly $r$ factors.</p>"
    },
