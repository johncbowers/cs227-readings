    { type: "prose", html:
      "<p>A <strong>set</strong> is an unordered collection of distinct <strong>elements</strong>. Write $x \\in A$ for &ldquo;$x$ is in $A$,&rdquo; list small sets in braces ($\\{1,2,3\\}$), and write $|A|$ for the number of elements (the <strong>cardinality</strong>). Because a set is unordered and has no repeats, $\\{1,2,3\\}$, $\\{3,2,1\\}$, and $\\{1,1,2,3\\}$ all name the same set — unlike the ordered tuples of the last reading. We write $A \\subseteq B$ (&ldquo;$A$ is a subset of $B$&rdquo;) when every element of $A$ is also in $B$ — note the hidden &ldquo;for all.&rdquo;</p>"

      "<li><strong>Difference</strong> $A \\setminus B$: everything in $A$ that is not in $B$.</li>" +
      "</ul>" +

      "<h2>Sets and conditions are two sides of a coin</h2>" +
      "<p>Every condition carves out a set — the objects that satisfy it — and every set is the condition &ldquo;belongs to this set.&rdquo; <strong>Set-builder notation</strong> writes this directly: $\\{x : P(x)\\}$ is &ldquo;the set of all $x$ for which $P(x)$ holds,&rdquo; and $\\{x \\in A : P(x)\\}$ narrows that to the elements of $A$ satisfying $P$. For instance, $\\{n : n \\text{ is even}\\}$ is the set of even integers.</p>" +
      "<p>The operations line up with the connectives you already use in words: union with &ldquo;or,&rdquo; intersection with &ldquo;and,&rdquo; and complement with &ldquo;not.&rdquo; Combining conditions with &ldquo;and,&rdquo; &ldquo;or,&rdquo; &ldquo;not&rdquo; is the same as combining their sets with $\\cap$, $\\cup$, and complement. There is one twist: taking a complement flips the connective. &ldquo;Not (even <em>and</em> positive)&rdquo; becomes &ldquo;odd <em>or</em> not positive&rdquo; — the &ldquo;and&rdquo; turns into an &ldquo;or.&rdquo;</p>"
