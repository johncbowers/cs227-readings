function treeGrower(el, api) {
  var W = 560, gap = 46, h = 2, maxH = 3;
  el.innerHTML =
    '<div class="r-controls">' +
      '<label style="font-size:14px;color:var(--r-muted)">height</label>' +
      '<input type="range" id="tg-h" min="0" max="' + maxH + '" step="1" value="2" style="width:180px" aria-label="tree height" />' +
      '<span class="r-stat">height <b id="tg-hv" style="display:inline">2</b></span>' +
      '<span class="r-stat">nodes <b id="tg-n" style="display:inline"></b></span>' +
      '<span class="r-stat">leaves <b id="tg-l" style="display:inline"></b></span>' +
    '</div>' +
    '<div id="tg-svg" style="overflow-x:auto"></div>' +
    '<p style="font-size:14px;color:var(--r-muted);margin:.6rem 0 0">A <em>perfect</em> binary tree of height h. Drag the slider: nodes = 2<sup>h+1</sup>−1, leaves = 2<sup>h</sup> — closed forms you can prove by induction.</p>';
  var svgBox = el.querySelector("#tg-svg");
  function render(H) {
    var levels = H + 1, height = levels * gap + 24, nodes = [];
    for (var k = 0; k <= H; k++) { var cnt = Math.pow(2, k); for (var j = 0; j < cnt; j++) nodes.push({ x: (j + 0.5) * (W / cnt), y: 22 + k * gap, k: k }); }
    var svg = '<svg viewBox="0 0 ' + W + ' ' + height + '" width="100%" style="max-width:' + W + 'px" role="img" aria-label="A perfect binary tree of height ' + H + '">';
    for (var k2 = 0; k2 < H; k2++) { var cnt2 = Math.pow(2, k2); for (var j2 = 0; j2 < cnt2; j2++) {
      var px = (j2 + 0.5) * (W / cnt2), py = 22 + k2 * gap, ccnt = cnt2 * 2;
      [2 * j2, 2 * j2 + 1].forEach(function (cj) { var cx = (cj + 0.5) * (W / ccnt), cy = 22 + (k2 + 1) * gap;
        svg += '<line class="r-edge" x1="' + px + '" y1="' + py + '" x2="' + cx + '" y2="' + cy + '" stroke-width="1.5" />'; });
    } }
    nodes.forEach(function (nd) { var isLeaf = nd.k === H;
      svg += '<circle class="' + (isLeaf ? "r-leaf" : "r-node") + '" cx="' + nd.x + '" cy="' + nd.y + '" r="11" stroke-width="1.5" />'; });
    svg += "</svg>"; svgBox.innerHTML = svg;
    el.querySelector("#tg-hv").textContent = H;
    el.querySelector("#tg-n").textContent = Math.pow(2, H + 1) - 1;
    el.querySelector("#tg-l").textContent = Math.pow(2, H);
  }
  el.querySelector("#tg-h").addEventListener("input", function (e) { render(Number(e.target.value)); });
  render(h);
}

      "</ul>" +
      "<p>Each definition has a <strong>base</strong> constructor and a <strong>building</strong> constructor. That shape gives us two gifts: we can <em>define functions</em> by giving one equation per constructor, and we can <em>prove</em> $(\\forall t)\\,P(t)$ by matching the constructors.</p>" +
