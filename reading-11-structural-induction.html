    { type: "prose", html:
      "<p>An <strong>inductively generated collection</strong> starts with specified <strong>base objects</strong> and grows by specified <strong>construction rules</strong>. The collection contains the bases, is closed under the rules, and contains nothing that the bases and rules do not generate. In other words, it is the <strong>smallest set</strong> containing the bases and closed under the rules.</p>" +
      "<p>The word <em>smallest</em> matters. Merely saying that a set contains the bases and is closed under the rules would allow unrelated objects to be included. An inductive definition says that every object in the collection has a finite construction from the bases using the rules.</p>"

      "<li><strong>Rule 1:</strong> if $s \\in L$, then $ab\\,s\\,ba \\in L$.</li>" +
      "<li><strong>Rule 2:</strong> if $s \\in L$, then $a\\,s\\,a \\in L$.</li></ul>" +
      "<p>Here $ab\\,s\\,ba$ means the string obtained by putting $ab$ before $s$ and $ba$ after it. Thus $aa$, $aaaa$, $abaaba$, and $aaaaaa$ are generated; a string is in $L$ only when some finite chain of these rules builds it from a base.</p>"
    },

      "<li>for <strong>every construction rule</strong>, assume $P$ for each recursively supplied input and prove $P$ for the object constructed by that rule.</li></ul>" +
