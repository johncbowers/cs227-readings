    { type: "def", title: "Proof by contradiction", html:
      "<p>To prove a goal $G$: assume $\\neg G$, and derive a <strong>known-false statement</strong> (a contradiction, such as $5 < 5$, $1 = 0$, or $n$ both even and odd). Since the assumption led to an impossibility, $\\neg G$ cannot hold, so $G$ must be true. A merely surprising statement is not enough — only a genuine impossibility rules out $\\neg G$. Negating the goal cleanly (Reading 15) is the first move.</p>" +
      "<p>Negating common goals:</p>" +
      "<ul>" +
      "<li><strong>Implication:</strong> $\\neg(P \\rightarrow Q) \\equiv P \\wedge \\neg Q$ — keep the hypothesis, deny the conclusion.</li>" +
      "<li><strong>Disjunction (DeMorgan):</strong> $\\neg(P \\vee Q) \\equiv \\neg P \\wedge \\neg Q$; e.g. the negation of the goal “$x > 50$ or $y > 50$” is “$x \\le 50$ and $y \\le 50$.”</li>" +
      "<li><strong>Universal:</strong> $\\neg(\\forall n)\\,P(n) \\equiv (\\exists n)\\,\\neg P(n)$.</li>" +
      "<li><strong>Existence / non-existence:</strong> the negation of “there is no $X$” is “some $X$ exists,” so you <em>assume such an $X$ exists</em>. To attack goals like “there is no largest integer” or “there are infinitely many primes,” assume the opposite: a largest integer $N$ exists, or only finitely many primes exist.</li>" +
      "</ul>"
    },
    { type: "prose", html:
      "<h2>Facts these proofs use</h2>" +
      "<p>Contradiction proofs often finish with a parity or divisibility fact:</p>" +
      "<ul>" +
      "<li>An <strong>even</strong> number squared is a multiple of $4$: $(2k)^2 = 4k^2$, so remainder $0$ when divided by $4$.</li>" +

      "</ul>" +
      "<p>Two more setups worth recognizing:</p>" +
      "<ul>" +
      "<li><strong>Strict prefixes:</strong> a strict prefix of a string has strictly smaller length. So if a string were a strict prefix of itself, its length would be strictly less than itself — impossible.</li>" +
      "</ul>"

    { type:"parsons", id:"m1", practice:true,

    { type:"challenge", id:"ch1",
      prompt:"Prove by contradiction: there is no smallest positive real number.",
      solution:"Suppose for contradiction there is a smallest positive real $\\varepsilon > 0$. Consider $\\varepsilon/2$. Since $\\varepsilon > 0$, we have $\\varepsilon/2 > 0$, so $\\varepsilon/2$ is positive; and $\\varepsilon/2 < \\varepsilon$. So $\\varepsilon/2$ is a positive real smaller than $\\varepsilon$, contradicting that $\\varepsilon$ was smallest. Hence no smallest positive real exists. $\\blacksquare$" },
