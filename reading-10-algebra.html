    { type: "def", title: "Two extra moves", html:
      "<ul>" +
      "<li><strong>Algebra.</strong> Any valid algebraic step — distributing, combining like terms, manipulating an inequality — is a legal step in a proof.</li>" +
      "<li><strong>Equational reasoning.</strong> Once you've established $s = t$, you may replace $s$ by $t$ (or vice versa) wherever it appears.</li>" +
      "</ul>" +
      "<p>We also help ourselves to basic <em>known facts</em> as axioms, e.g. “the product of two positives is positive”: $(\\forall a)(\\forall b)\\big(0 < a \\rightarrow (0 < b \\rightarrow 0 < a\\cdot b)\\big)$.</p>"

      "<p>The algebra above joins the logical proof moves from earlier readings. Since the proofs below combine them, here is a quick recap:</p>" +
      "<ul>" +
      "<li><strong>Universal generalization.</strong> To prove $(\\forall x)\\,P(x)$, introduce a fresh <em>arbitrary</em> $x$ (assume nothing special about it) and prove $P(x)$. Because $x$ was arbitrary, the result holds for every $x$. Picking one convenient value would not do — a single case cannot establish a claim about all $x$.</li>" +
      "<li><strong>Conditional proof (“make-believe”).</strong> To prove an implication $A \\rightarrow B$, temporarily <em>assume</em> the hypothesis $A$ and derive the conclusion $B$. Each nested arrow you open adds one assumption: to prove $A \\rightarrow (B \\rightarrow (C \\rightarrow D))$ you assume $A$, then $B$, then $C$, and prove $D$ — three hypotheses for three arrows.</li>" +
      "<li><strong>Detachment (modus ponens).</strong> From $A$ together with $A \\rightarrow B$ you may conclude $B$: you “detach” the arrow using the hypothesis. An axiom with several stacked arrows must be detached once for each arrow.</li>" +
      "</ul>"
    },

      "<li><strong>Commutativity:</strong> $a + b = b + a$ and $a\\cdot b = b\\cdot a$.</li>" +
      "<li><strong>Associativity:</strong> $(a+b)+c = a+(b+c)$ and $(a\\cdot b)\\cdot c = a\\cdot(b\\cdot c)$.</li>" +
      "<li><strong>Combining like terms:</strong> e.g. $x + x = 2x$ and $ab + ab = 2ab$.</li>" +
      "<li><strong>Binomial squares:</strong> $(a+b)^2 = a^2 + 2ab + b^2$ and $(a-b)^2 = a^2 - 2ab + b^2$.</li>" +
      "<li><strong>Difference of squares:</strong> $a^2 - b^2 = (a+b)(a-b)$.</li>" +
      "</ul>" +
      "<p>Beware of non-identities: $a - b = b - a$ is false in general (try $a=3,\\ b=1$), $x + x = 2x$ is <em>not</em> $x^2$, and $x^2 = 4$ does not give $x = 2$ (it could be $-2$, since squaring loses the sign). For ordering facts, $x < 0$ is equivalent to $0 < -x$, and beyond the product-of-positives axiom the product of two <em>negatives</em> is positive.</p>"
