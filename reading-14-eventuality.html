      "<p>When we compare how two functions grow, we often don’t care about small inputs — only about what happens <em>eventually</em>. This is a nested quantifier pattern you’ll see again in algorithms: “there is a threshold beyond which something always holds.”</p>"

      "<p>For functions $f,g:\\mathbb{R}\\to\\mathbb{R}$, $f$ is <strong>eventually greater than</strong> $g$ when there is a real threshold $x_0$ past which $f$ always beats $g$:</p>" +

      "<p>The guard $x>x_0$ is doing real work: eventuality says nothing about inputs at or below the threshold. Earlier exceptions are allowed.</p>" +
      "<p><strong>“For all $x$” is stronger than “eventually.”</strong> If $f(x)>g(x)$ for every real $x$, then threshold $x_0=0$ certainly works. The converse fails because eventual dominance permits earlier exceptions.</p>" +
      "<h2>Finding a threshold</h2>" +
      "<p>To find a threshold, solve or otherwise prove the inequality $f(x)>g(x)$ under an assumption $x>x_0$. For example, $x^2>5x$ follows whenever $x>5$: because $x>5>0$, multiplying $x>5$ by the positive number $x$ gives $x^2>5x$. Examples can suggest a threshold, but checking successive values cannot prove the inequality stays true forever; the final justification must cover every $x$ beyond the chosen threshold.</p>" +
      "<h2>Transitivity</h2>" +
      "<p>“Eventually greater than” is <strong>transitive</strong>. If $f$ eventually beats $g$ past $x_1$ and $g$ eventually beats $h$ past $x_2$, then past $x_0=\\max(x_1,x_2)$ both comparisons hold at once, so $f(x)>g(x)>h(x)$ and hence $f(x)>h(x)$.</p>"
