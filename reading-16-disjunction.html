    { type: "def", title: "Disjunction and DeMorgan", html:
      "<ul>" +
      "<li><strong>DeMorgan:</strong> $\\neg(P \\wedge Q) \\equiv \\neg P \\vee \\neg Q$ &nbsp;and&nbsp; $\\neg(P \\vee Q) \\equiv \\neg P \\wedge \\neg Q$. The same rule works for any number of operands: push the negation inward and flip every $\\wedge$ to $\\vee$ (and vice versa), so $\\neg(A \\wedge B \\wedge C) \\equiv \\neg A \\vee \\neg B \\vee \\neg C$. Nested formulas negate one layer at a time: $\\neg\\big(P \\wedge (Q \\vee R)\\big) \\equiv \\neg P \\vee \\neg(Q \\vee R) \\equiv \\neg P \\vee (\\neg Q \\wedge \\neg R)$.</li>" +
      "<li>Two negations from earlier readings pair naturally with DeMorgan: $\\neg(P \\rightarrow Q) \\equiv P \\wedge \\neg Q$, and $\\neg(\\forall x)\\,P(x) \\equiv (\\exists x)\\,\\neg P(x)$.</li>" +
      "<li>To <strong>prove</strong> a goal $P \\vee Q$, prove <em>one</em> disjunct. Reading 17 will introduce additional proof strategies that use negation and contradiction.</li>" +
      "<li>To <strong>use</strong> a known $P \\vee Q$, argue by <strong>cases</strong>: reach the goal assuming $P$, and again assuming $Q$. A disjunction with $k$ alternatives (say $P \\vee Q \\vee R$) requires the goal to be derived in all $k$ cases.</li>" +
      "</ul>"
    },
    { type: "prose", html:
      "<h2>Disjunctions worth splitting on</h2>" +
      "<p>Proof by cases needs a true disjunction to split on. A few come up constantly:</p>" +
      "<ul>" +
      "<li><strong>Parity:</strong> every integer is even or odd — two cases.</li>" +
      "<li><strong>Sign / trichotomy:</strong> every real number is $< 0$, $= 0$, or $> 0$ (three mutually exclusive cases). When only the split at zero matters, use $x \\ge 0$ or $x < 0$ (two cases).</li>" +
      "<li><strong>Absolute value</strong> is defined by that split: $|x| = x$ when $x \\ge 0$, and $|x| = -x$ when $x < 0$.</li>" +
      "</ul>" +
      "<p>Recursively built objects split on their <strong>constructors</strong>, and the number of constructors is the number of cases:</p>" +
      "<ul>" +
      "<li>A <strong>natural number</strong> is $0$ or $m + 1$ (the successor of some natural $m$) — two cases.</li>" +
      "<li>A <strong>string</strong> is $\\varepsilon$ (empty) or $a \\cdot w'$ (a character prepended to a smaller string) — two cases.</li>" +
      "<li>A <strong>list</strong> is $\\mathrm{nil}$ or $\\mathrm{cons}(h, t)$ (a head consed onto a tail) — two cases.</li>" +
      "<li>A <strong>binary tree</strong> is a leaf or a node with two subtrees — two cases.</li>" +
      "</ul>"

    { type:"challenge", id:"ch1",
      prompt:"Prove by cases: for every integer $n$, $n^2 + n$ is even.",
      solution:"Every integer is even or odd. <strong>Case 1 ($n$ even):</strong> $n = 2k$, so $n^2 + n = n(n+1) = 2k(n+1)$, which is even. <strong>Case 2 ($n$ odd):</strong> $n+1$ is even, say $n+1 = 2k$, so $n^2 + n = n(n+1) = 2kn$, which is even. In both cases $n^2 + n$ is even, and one case always holds. $\\blacksquare$" },
