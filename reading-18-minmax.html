    { type: "def", title: "Max and min", html:
      "<p>If $x \\le y$ then $\\min(x,y) = x$ and $\\max(x,y) = y$ (and symmetrically). Basic bounds follow: $\\max(x,y) \\ge x$ and $\\max(x,y) \\ge y$ (the max is at least each input), while $\\min(x,y) \\le x$ and $\\min(x,y) \\le y$ (the min is at most each input). Also $\\min(x,y) \\le \\max(x,y)$ always, with equality only when $x = y$.</p>" +
      "<p>Comparing to a threshold $z$ gives four biconditionals:</p>" +
      "<ul>" +
      "<li>$\\max(x,y) < z \\iff (x < z \\;\\wedge\\; y < z)$ — for the <em>larger</em> to be below $z$, <strong>both</strong> must be. (Same with $\\le$: $\\max(x,y) \\le z \\iff (x \\le z \\;\\wedge\\; y \\le z)$.)</li>" +

      "<li>$\\max(x,y) > z \\iff (x > z \\;\\vee\\; y > z)$ — the larger exceeds $z$ as soon as either input does.</li>" +
      "<li>$\\min(x,y) > z \\iff (x > z \\;\\wedge\\; y > z)$ — for the smaller to exceed $z$, both must.</li>" +
      "</ul>" +
      "<p>Max-below and min-above use <strong>AND</strong>; min-below and max-above use <strong>OR</strong>. These extend to three or more values by nesting, e.g. $\\max(a,b,c) = \\max(a, \\max(b,c))$, so $\\max(a,b,c) < z$ exactly when all three of $a, b, c$ are below $z$.</p>"

      prompt:"Order the proof that $\\mathrm{height}(\\mathrm{node}(l, r)) \\ge \\mathrm{height}(l)$.",

    { type:"prose", html:"<h3 class='r-diff-head'>Challenge</h3>" },
    { type:"challenge", id:"ch1",
      prompt:"Prove that $\\max(x, y) < z$ if and only if $x < z$ and $y < z$.",
      solution:"By the axiom, either $x \\le y$ or $y \\le x$; take $x \\le y$ (the other case is symmetric), so $\\max(x,y) = y$. <strong>($\\Rightarrow$)</strong> If $\\max(x,y) = y < z$, then $y < z$; and since $x \\le y < z$, also $x < z$. <strong>($\\Leftarrow$)</strong> If $x < z$ and $y < z$, then $\\max(x,y) = y < z$. Hence $\\max(x,y) < z \\iff (x < z \\wedge y < z)$. $\\blacksquare$" },
    { type:"challenge", id:"ch2",

    { type:"challenge", id:"ch3",

      solution:"<strong>Base ($t = \\mathrm{leaf}$):</strong> $\\mathrm{height}(\\mathrm{leaf}) = 0 \\ge 0$. <strong>Step ($t = \\mathrm{node}(l, r)$):</strong> assume $\\mathrm{height}(l) \\ge 0$ and $\\mathrm{height}(r) \\ge 0$. Then $\\max(\\mathrm{height}(l), \\mathrm{height}(r)) \\ge 0$, so $\\mathrm{height}(\\mathrm{node}(l,r)) = 1 + \\max(\\mathrm{height}(l), \\mathrm{height}(r)) \\ge 1 \\ge 0$. By induction, $\\mathrm{height}(t) \\ge 0$ for all $t$. $\\blacksquare$" },

    { type:"challenge", id:"ch5",
      prompt:"Prove that $\\max$ is associative: $\\max(x, \\max(y, z)) = \\max(\\max(x, y), z)$.",
      solution:"Both sides equal the largest of $x, y, z$. Formally, for any threshold $w$, applying $\\max(a,b) < w \\iff (a < w \\wedge b < w)$ twice gives $\\max(x, \\max(y,z)) < w \\iff x < w \\wedge y < w \\wedge z < w \\iff \\max(\\max(x,y), z) < w$. Two values below exactly the same set of thresholds are equal, so $\\max(x,\\max(y,z)) = \\max(\\max(x,y), z)$. $\\blacksquare$" },
