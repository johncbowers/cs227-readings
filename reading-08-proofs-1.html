function guidedProof(el, api) {
  var knowns = [
    "(1)  (∀x)(M(x) → F(Fafnir, x))",
    "(2)  (∀x)(S(x) → M(x))",
    "(3)  S(Scrat)"
  ];
  var goal = "F(Fafnir, Scrat)";
  var steps = [
    { q: "Goal: F(Fafnir, Scrat). Start from what you know. Which rule applies first?",
      options: ["Universal instantiation of (2) at Scrat", "Detachment", "Make-believe"],
      correct: 0, derive: "(4)  S(Scrat) → M(Scrat)     [instantiate (2) at Scrat]" },
    { q: "You now have (3) S(Scrat) and (4) S(Scrat) → M(Scrat). Which rule?",
      options: ["Detachment on (4) using (3)", "Universal generalization", "Name a witness"],
      correct: 0, derive: "(5)  M(Scrat)     [detach (4) with (3)]" },
    { q: "Bring in Fafnir using known (1). Which rule?",
      options: ["Universal instantiation of (1) at Scrat", "Make-believe", "Existential generalization"],
      correct: 0, derive: "(6)  M(Scrat) → F(Fafnir, Scrat)     [instantiate (1) at Scrat]" },
    { q: "You have (5) M(Scrat) and (6) M(Scrat) → F(Fafnir, Scrat). Finish the proof.",
      options: ["Detachment on (6) using (5)", "Proof by cases", "Universal generalization"],
      correct: 0, derive: "(7)  F(Fafnir, Scrat)     ✓ goal reached" }
  ];
  var i = 0;
  el.innerHTML =
    '<div class="r-gp-state">' +
      '<div class="r-gp-col"><h4>Known</h4><ul>' + knowns.map(function (k) { return "<li>" + k + "</li>"; }).join("") + "</ul></div>" +
      '<div class="r-gp-col"><h4>Goal</h4><div class="r-gp-goal">' + goal + "</div></div>" +
    "</div>" +
    '<h4 style="font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--r-muted);margin:0 0 6px">Derived</h4>' +
    '<ul class="r-gp-derived" id="gp-derived"><li style="color:var(--r-muted)">(nothing yet — pick the first rule below)</li></ul>' +
    '<div id="gp-step"></div>';
  var derivedEl = el.querySelector("#gp-derived");
  var stepEl = el.querySelector("#gp-step");
  var started = false;
  function shuffleLocal(a) { a = a.slice(); for (var k = a.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var t = a[k]; a[k] = a[j]; a[j] = t; } return a; }
  function renderStep() {
    if (i >= steps.length) {
      stepEl.innerHTML = '<p class="r-feedback ok" style="margin-top:14px">Proof complete — every step followed from a rule, and you reached the goal.</p>';
      api.complete(); return;
    }
    var s = steps[i]; stepEl.innerHTML = "";
    var q = document.createElement("p"); q.className = "r-gp-q"; q.textContent = s.q;
    var wrap = document.createElement("div"); wrap.className = "r-choices";
    var fb = document.createElement("p"); fb.className = "r-feedback";
    shuffleLocal(s.options.map(function (_, idx) { return idx; })).forEach(function (idx) {
      var btn = document.createElement("button"); btn.className = "r-choice"; btn.type = "button";
      btn.innerHTML = '<span class="r-tick"></span><span>' + s.options[idx] + "</span>";
      btn.onclick = function () {
        if (idx === s.correct) {
          Array.prototype.forEach.call(wrap.children, function (c) { c.disabled = true; });
          btn.classList.add("correct");
          if (!started) { derivedEl.innerHTML = ""; started = true; }
          var li = document.createElement("li"); li.textContent = s.derive; derivedEl.appendChild(li);
          i++; setTimeout(renderStep, 180);
        } else {
          btn.classList.add("wrong");
          fb.className = "r-feedback no"; fb.textContent = "Not that rule — look for a known you can act on right now (a ∀ to instantiate, or an implication whose hypothesis you already have).";
        }
      };
      wrap.appendChild(btn);
    });
    stepEl.appendChild(q); stepEl.appendChild(wrap); stepEl.appendChild(fb);
  }
  renderStep();
}
