    { type: "def", title: "When is “if P then Q” false?", html:
      "<p>An implication $P \\rightarrow Q$ is <strong>false in exactly one case</strong>: when $P$ is true and $Q$ is false. In every other case it is true — including whenever $P$ is false, where we say it holds <strong>vacuously</strong>.</p>" +
      "<p>Think of it as a promise: “if $P$ happens, I guarantee $Q$.” The promise is broken only if $P$ happens and $Q$ doesn’t.</p>"

      "<p>Writing out all four combinations of $P$ and $Q$ makes the rule concrete:</p>" +

      "<li>$P$ true, $Q$ true: $P \\rightarrow Q$ is <strong>true</strong>.</li>" +
      "<li>$P$ true, $Q$ false: $P \\rightarrow Q$ is <strong>false</strong> — the one and only false row.</li>" +
      "<li>$P$ false, $Q$ true: $P \\rightarrow Q$ is <strong>true</strong> (vacuous).</li>" +
      "<li>$P$ false, $Q$ false: $P \\rightarrow Q$ is <strong>true</strong> (vacuous).</li>" +
      "</ul>" +
      "<p>So across the four rows $P \\rightarrow Q$ is true in three and false in only one.</p>"

      answer: 0,
