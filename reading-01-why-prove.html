/* ---- custom widget: greedy interval-scheduling counterexample explorer ---- */
function greedyExplorer(el, api) {
  var W = 520, maxT = 10, padL = 34, barH = 16, gap = 10, topPad = 8;
  var rules = {
    start: {
      label: "Earliest start",
      intervals: [[0,9],[1,3],[4,6],[7,9]],
      chosen: [0], best: 3, ok: false,
      note: "Grabbing the event that starts first takes the long [0–9] block and crowds out everything else."
    },
    short: {
      label: "Shortest first",
      intervals: [[0,5],[4,6],[5,10]],
      chosen: [1], best: 2, ok: false,
      note: "The shortest event [4–6] sits in the middle and conflicts with both others, blocking the two that would have fit."
    },
    finish: {
      label: "Earliest finish",
      intervals: [[0,9],[1,3],[4,6],[7,9]],
      chosen: [1,2,3], best: 3, ok: true,
      note: "Taking the event that finishes earliest keeps the most room for what follows. On this schedule it finds all 3 — and it can be proven optimal on every schedule."
    }
  };
  el.innerHTML =
    '<div class="r-controls">' +
      '<button class="r-btn" id="g-start" type="button">Earliest start</button>' +
      '<button class="r-btn" id="g-short" type="button">Shortest first</button>' +
      '<button class="r-btn" id="g-finish" type="button">Earliest finish</button>' +
    '</div>' +
    '<div id="g-svg"></div>' +
    '<p id="g-cap" class="r-feedback" style="min-height:40px">Pick a greedy rule above and see how it does. Green = the events the rule selects.</p>';
  var svgBox = el.querySelector("#g-svg");
  function x(t) { return padL + (t / maxT) * (W - padL - 12); }
  function draw(key) {
    var r = rules[key];
    var n = r.intervals.length;
    var height = topPad * 2 + n * (barH + gap);
    var s = '<svg viewBox="0 0 ' + W + ' ' + height + '" width="100%" style="max-width:' + W + 'px" role="img" aria-label="Interval schedule for the ' + r.label + ' rule">';
    r.intervals.forEach(function (iv, idx) {
      var y = topPad + idx * (barH + gap);
      var chosen = r.chosen.indexOf(idx) !== -1;
      var fill = chosen ? "var(--r-success-bg)" : "var(--r-surface)";
      var stroke = chosen ? "var(--r-success)" : "var(--r-border-strong)";
      s += '<rect x="' + x(iv[0]) + '" y="' + y + '" width="' + (x(iv[1]) - x(iv[0])) + '" height="' + barH + '" rx="4" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.5" />';
      s += '<text x="' + (x(iv[0]) + 6) + '" y="' + (y + barH - 4) + '" font-size="11" fill="var(--r-text)">[' + iv[0] + ',' + iv[1] + ']</text>';
    });
    s += "</svg>";
    svgBox.innerHTML = s;
    var cap = el.querySelector("#g-cap");
    cap.className = "r-feedback " + (r.ok ? "ok" : "no");
    cap.innerHTML = "<strong>" + r.label + "</strong> selects <strong>" + r.chosen.length + "</strong> event" + (r.chosen.length === 1 ? "" : "s") +
      ", but up to <strong>" + r.best + "</strong> can fit. " + r.note +
      (r.ok ? "" : " &nbsp;&larr; a counterexample to “this rule is always best.”");
  }
  el.querySelector("#g-start").onclick = function () { draw("start"); };
  el.querySelector("#g-short").onclick = function () { draw("short"); };
  el.querySelector("#g-finish").onclick = function () { draw("finish"); api.complete(); };
}

Reading.init({
  id: "01-why-prove",
  crumb: '<a href="index.html">CS 227 Readings</a> · Reading 1',
  title: "Reading 1 — Why prove?",
  subtitle: "Before any logic: why does computer science need proof at all? Because testing an implementation is not the same as verifying an algorithm.",
  next: { href: "reading-02-conditions.html", label: "Reading 2 — Conditions and types" },
  blocks: [
    { type: "prose", html:
      "<p>Here is a problem. You are given a list of events, each with a start and finish time, and you may attend two events only if they don’t overlap — two events overlap when one starts strictly before the other finishes, so events that merely touch at an endpoint (one finishing exactly when the next starts) do <em>not</em> overlap and may both be attended. Goal: attend as many events as possible. A natural idea is a <strong>greedy</strong> rule — repeatedly grab some “best-looking” event, throw away everything that conflicts with it, and repeat.</p>" +
      "<p>But which rule? Try a few below. Watch what happens.</p>"
    },
    { type: "custom", id: "greedy", activity: true, render: greedyExplorer },
    { type: "prose", html:
      "<p>Most plausible greedy rules are <em>wrong</em>: for each one there is some schedule where it misses the best answer. One rule — <strong>earliest finish</strong> — always works, but that is not obvious, and no amount of trying examples can establish it. You could test a thousand schedules and still miss the one where a rule fails.</p>" +
      "<p>This is the gap at the heart of the course. <strong>Testing</strong> runs a program on some inputs and checks the outputs — it can reveal bugs, but it can never cover the infinitely many possible inputs. <strong>Proof</strong> is an argument that a claim holds for <em>every</em> input at once. To know an algorithm is correct, you must prove it.</p>" +
      "<p>Some vocabulary for this asymmetry. A claim of the form “for <em>every</em> input, something holds” is a <strong>universal claim</strong> — for example, “earliest-start is <em>always</em> optimal.” A single input on which the claim fails is a <strong>counterexample</strong>, and exhibiting one <strong>refutes</strong> the claim (proves it false). The asymmetry is stark: one counterexample is enough to refute a universal claim, but no number of successful examples can prove one. Proving a universal claim requires a general argument that covers every input at once.</p>"
    },
    { type: "mc", id: "q1",
      prompt: "What does running many tests on a program’s implementation establish?",
      choices: [
        "It can reveal bugs, but it cannot prove the algorithm is correct on every input",

        "It proves correctness, but only for large inputs",
        "Testing and proof establish exactly the same thing"
      ],
      answer: 0,
      choiceFeedback: [
        null,
        "No finite set of tests can cover infinitely many possible inputs — a rule can pass many tests and still fail on one you didn’t try.",
        "Input size isn’t the issue; the issue is that tests only ever check finitely many cases.",
        "They differ crucially: testing checks some cases; proof covers all of them."
      ],
      explain: "Tests only ever exercise finitely many inputs. They are great for catching bugs, but proving a claim about *every* input requires an argument, not examples."
    },
    { type: "mc", id: "q2",

        "An unrelated example",
        "A special case that doesn’t really matter"
      ],
      answer: 0,
      choiceFeedback: [
        null,
        "It does the opposite of proving it — a single failing case shows the “always” claim is false.",
        "It’s directly on point: it’s an input on which the claimed-optimal rule isn’t optimal.",
        "It matters entirely — an “always” claim is broken by even one exception."
      ],
      explain: "A universal claim (“always … the most”) is refuted by a single counterexample — exactly one input where it fails."
    },
    { type: "mc", id: "q3",
      prompt: "To establish a claim of the form “for every input, $P$ holds,” it is enough to:",
      choices: [
        "give an argument that covers every possible input at once",
        "check a handful of inputs",
        "check the largest input",
        "exhibit one input where $P$ holds"
      ],
      answer: 0,
      choiceFeedback: [
        null,
        "Checking some inputs can never rule out a failure among the ones you didn’t check.",
        "There may be no “largest” input, and size isn’t what makes the claim true.",
        "One success shows the claim isn’t always false — but not that it always holds."
      ],
      explain: "A “for every input” claim needs a general argument (a proof). One example can refute a universal claim, but never prove one."
    },
    { type: "prose", html:
      "<h2>Apply it</h2>" +
      "<p>The whole course turns on the difference between an example and an argument. This last one checks that you’ve got the asymmetry straight.</p>"
    },
    { type: "mc", id: "t1", badge: "Apply it",
      prompt: "You want to show the claim “shortest-first always selects the maximum number of events” is <strong>false</strong>. What must you provide?",
      choices: [
        "One schedule where shortest-first selects fewer than the maximum possible",
        "A proof that shortest-first is optimal",
        "Several schedules where shortest-first happens to work",
        "The definition of the shortest-first rule"
      ],
      answer: 0,
      choiceFeedback: [
        null,
        "That would show it’s true, the opposite of what you want.",
        "Schedules where it works can’t show it’s false — you need one where it fails.",
        "A definition alone settles nothing about whether the rule is optimal."
      ],
      explain: "To disprove a universal (“always”) claim, exhibit a single counterexample: one schedule where shortest-first falls short of the best possible."
    },
    { type: "prose", html: "<div class='r-practice-head'></div><h2>Exam practice</h2><p>Extra problems for exam review. These are <em>not</em> graded and don’t affect your progress bar. Challenge-problem solutions are hidden until you click.</p>" },
    { type: "prose", html: "<h3 class='r-diff-head'>Easy</h3>" },
    { type: "mc", id: "e1", practice: true,
      prompt: "Which of the following can a finite set of tests establish about an algorithm?",
      choices: [
        "That the algorithm has a bug on at least one tested input",
        "That the algorithm is correct on every possible input",
        "That no input can ever make the algorithm fail",
        "That writing a proof would be a waste of time"
      ],
      answer: 0,
      explain: "A failing test exhibits a concrete input where the program misbehaves, so testing can reveal bugs. But no finite set of tests can rule out failure on the inputs you didn’t try."
    },
    { type: "shortnum", id: "e2", practice: true,
      prompt: "To disprove a claim of the form “rule $R$ always selects the most events,” how many counterexamples do you need?",
      answer: 1,
      hint: "A single failing input is enough to break an “always” claim.",
      explain: "One counterexample — a single schedule where $R$ falls short — refutes a universal (“always”) claim."
    },
    { type: "mc", id: "e3", practice: true,
      prompt: "Among the greedy rules explored, which one can be proven to always select the maximum number of events?",
      choices: ["Earliest finish", "Earliest start", "Shortest first", "Longest first"],
      answer: 0,
      explain: "Earliest finish is the one rule that provably works on every schedule; the others each have a counterexample."
    },
    { type: "shorttext", id: "e5", practice: true,
      prompt: "What single word names an argument that a claim holds for <em>every</em> input at once?",
      answer: "proof",
      accept: ["a proof"],
      explain: "A proof establishes a claim for all inputs simultaneously — something no finite collection of tests can do."
    },
    { type: "prose", html: "<h3 class='r-diff-head'>Medium</h3>" },
    { type: "mc", id: "m1", practice: true,
      prompt: "You test the earliest-start rule on 500 random schedules and it selects the maximum every time. What may you conclude?",
      choices: [
        "Nothing that proves it always works — the 501st schedule could still be a counterexample",

        "It must be faster than the earliest-finish rule"

      answer: 0,
      explain: "Passing 500 tests leaves infinitely many untested schedules. In fact earliest-start does have counterexamples, so no number of passing tests could ever make it correct."
    },
    { type: "shortnum", id: "m2", practice: true,
      prompt: "On the schedule $[0,5], [4,6], [5,10]$, the shortest-first rule grabs $[4,6]$. By how many events does it fall short of the best possible?",
      answer: 1,
      hint: "Shortest-first selects just 1 here. How many events can actually be scheduled?",
      explain: "Shortest-first takes $[4,6]$ and selects only 1 event, but $[0,5]$ and $[5,10]$ fit together for 2. It falls short by $2 - 1 = 1$."
    },
    { type: "matching", id: "m3", practice: true,
      prompt: "Match each term to its description.",
      pairs: [
        { left: "Counterexample", right: "one input that refutes a universal claim" },
        { left: "Testing", right: "running a program on some inputs to check outputs" },

      prompt: "What is the maximum number of non-overlapping events you can select from $[1,3], [2,5], [4,7], [6,8], [7,9]$? (Events may touch at an endpoint.)",
      answer: 3,
      hint: "Try the earliest-finish rule: repeatedly take the compatible event that finishes soonest.",
      explain: "Earliest-finish takes $[1,3]$, then $[4,7]$, then $[7,9]$ — three non-overlapping events, and no selection does better."
    },
    { type: "prose", html: "<h3 class='r-diff-head'>Challenge</h3>" },
    { type: "challenge", id: "ch1",
      prompt: "Give a schedule of 4 events on which the earliest-start rule selects only 1 event, even though 3 events can be scheduled. Explain what goes wrong.",
      solution: "Take the events $[0,10], [1,4], [4,7], [7,10]$. Earliest-start first grabs the event that begins soonest, $[0,10]$, which overlaps all three others — so it selects just <strong>1</strong> event and stops. But $[1,4], [4,7], [7,10]$ are pairwise non-overlapping (they only touch at endpoints), giving <strong>3</strong> events. The rule fails because a single early <em>start</em> says nothing about how much room the event leaves behind: $[0,10]$ starts first yet consumes the entire timeline. This one schedule is a counterexample, so “earliest-start is always optimal” is false."
    },
    { type: "challenge", id: "ch2",
      prompt: "Explain, in a short argument, why passing 1,000,000 tests does not prove an algorithm correct — even if every test passes.",
      solution: "Correctness is the claim “for <em>every</em> input, the output is right.” A test checks this for one input. Running 1,000,000 tests checks 1,000,000 particular inputs, but the set of possible inputs is unbounded (there are infinitely many finite inputs, e.g. every list, every integer). So after any finite number of passing tests there remain inputs never checked, and the algorithm could fail on one of them. Passing tests establishes the claim on the tested inputs only; it cannot rule out failure on the rest. Bridging from “some inputs” to “every input” requires a general argument — a proof — not more examples."
    },
    { type: "challenge", id: "ch3",
      prompt: "Sketch why the earliest-finish rule really is optimal on <em>every</em> schedule. (An exchange argument.)",
      solution: "Let $g_1$ be the event earliest-finish picks first — the one with the smallest finish time overall. Take any optimal selection $O$ and let $o_1$ be its earliest-finishing event. Since $g_1$ finishes no later than $o_1$, replacing $o_1$ by $g_1$ in $O$ still leaves a valid selection of the same size: anything compatible with $o_1$ (which finishes at or after $g_1$) is still compatible with $g_1$. So there is an optimal solution that agrees with greedy on the first choice. Now delete $g_1$ and every event overlapping it, and repeat the same argument on the smaller schedule. By induction, greedy matches an optimal solution at every step, so it selects the maximum number of events on every schedule. The key is that the earliest finish time leaves the most room for what follows — a property that holds for all inputs, which is exactly why examples alone could never have told us this."
    },
    { type: "challenge", id: "ch4",
      prompt: "The shortest-first rule sounds reasonable. Construct the <em>smallest</em> schedule (fewest events) on which it fails, and explain why “shortest wins locally but loses globally.”",
      solution: "Three events suffice, and two never do. With one event, shortest-first picks it — optimal. With two events, either they overlap (at most 1 can be chosen, and shortest-first picks one — optimal) or they don’t (shortest-first picks one, then the other — 2, optimal). So no 2-event schedule can defeat it. A 3-event counterexample: $[0,5], [4,6], [5,10]$. The shortest event is $[4,6]$ (length 2); shortest-first grabs it, but $[4,6]$ overlaps <em>both</em> other events, so the rule selects only <strong>1</strong>. Yet $[0,5]$ and $[5,10]$ are compatible, giving <strong>2</strong>. Shortest wins locally (it is the smallest event) but loses globally (it sits in the middle and blocks the two events that would have fit around it). Hence the minimum-size counterexample has 3 events."
    },
    { type: "prose", html:
      "<h2>Where this is headed</h2>" +
