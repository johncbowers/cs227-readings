      "<h2>Sets and conditions are two sides of a coin</h2>" +
      "<p>Every condition carves out a set — the objects that satisfy it — and every set is the condition “belongs to this set.” <strong>Set-builder notation</strong> writes this directly: $\\{x : P(x)\\}$ is “the set of all $x$ for which $P(x)$ holds,” and $\\{x \\in A : P(x)\\}$ narrows that to the elements of $A$ satisfying $P$. For instance, $\\{n : n$ is even$\\}$ is the set of even integers, and $\\{n \\in A : n$ is odd$\\}$ keeps just the odd members of $A$.</p>" +
