    { type: "prose", html:
      "<p>To <strong>count</strong> a collection is to say how many members it has without listing them all. The key move is to describe each member as the result of a short sequence of <em>choices</em>, and then count the choices. In class you counted functions this way; here we turn that idea into two rules — the <strong>product rule</strong> and the <strong>sum rule</strong> — that organize almost all of the counting we do.</p>" +
      "<p>Two pieces of notation. We write $x \\in A$ for &ldquo;$x$ is a member of $A$,&rdquo; and $|A|$ for the number of members of $A$, called its <strong>cardinality</strong> or size. (Some books, and our activity, also write $\\#A$ for the same thing.)</p>"

    { type: "def", title: "Counting functions, by construction", html:
      "<p>A <strong>function</strong> $f : X \\to Y$ assigns to each input in $X$ exactly one output in $Y$. To <em>build</em> one, walk through the inputs and choose an output for each. The choices are independent — a function may send two inputs to the same output — so with $m$ inputs and $n$ possible outputs there are</p>" +
      "<p style='text-align:center'>$\\underbrace{n \\cdot n \\cdots n}_{m} = n^{m}$</p>" +
      "<p>functions. Each sequence of choices builds a different function, and every function arises from exactly one sequence.</p>"
    },
    { type: "prose", html:

      "<p>Suppose we pick one section from $C = \\{c_1, c_2, c_3\\}$ and pair it with one professor from $P = \\{\\text{Bowers}, \\text{Lam}, \\text{Molloy}, \\text{Weikle}\\}$. Each outcome is an <strong>ordered pair</strong> $(c, p)$: the first entry is the section, the second is the professor. The set of <em>all</em> such pairs is the <strong>Cartesian product</strong> $C \\times P = \\{(c,p) : c \\in C,\\ p \\in P\\}$.</p>" +
      "<p><em>Order is part of the pair.</em> A pair in $P \\times C$ looks like $(\\text{Bowers}, c_1)$ — professor first — so $C \\times P$ and $P \\times C$ are different sets of pairs, even though you could pair them up by reversing each pair. Building a pair takes two independent choices, so $|C \\times P| = |C| \\cdot |P| = 3 \\cdot 4 = 12$.</p>"

      "<p>Sometimes a collection splits into separate cases rather than successive choices. A cafe customer orders <em>either</em> one breakfast (say $|B| = 6$ possible orders) <em>or</em> one lunch ($|L| = 12$), but not both. The number of possible orders is $|B| + |L| = 18$ — we <strong>add</strong>, because each order is one case or the other, not a combination of both.</p>" +
