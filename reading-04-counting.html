    { type: "prose", html:
      "<p>This reading develops two ideas that appear throughout computer science: <strong>functions</strong> and <strong>counting</strong>. We will first develop them separately and then connect them by asking how many functions can be defined from one finite set to another.</p>" +
      "<p>A <strong>function</strong> describes an <em>assignment</em>: it assigns each input a single output. Placing each student in a dorm, sorting each file into a folder, giving each pixel a color, and mapping each program input to its output can all be modeled as functions. <strong>Counting</strong> determines how many objects of a given kind exist without listing them all—for example, passwords of a given length, possible course schedules, or states a program might have to search.</p>" +
      "<p>We will study one-to-one and onto functions; countable and uncountable sets; ordered pairs and tuples; the product and sum rules; union and intersection; and counting sets that overlap. We will then apply these ideas to functions and strings.</p>" +
      "<p>A <strong>set</strong> is a collection of distinct objects. We write $\\{a, b, c\\}$ for the set containing $a$, $b$, and $c$, and may name it by writing $A = \\{a, b, c\\}$. Unlike a list, a set has no order and contains no duplicate members. Thus $\\{a, b, c\\}$, $\\{b, a, c\\}$, and $\\{a, b, a, c, a\\}$ are the same set.</p>" +
      "<p>We write $x \\in A$ to say that $x$ is a member of set $A$, and we write $|A|$ (or sometimes $#A$) for the number of members of $A$, called its <strong>cardinality</strong> or size.</p>" +
      "<p>Several number sets will appear throughout this course:</p>" +
      "<ul><li>$\\mathbb{N}=\\{0,1,2,3,\\ldots\\}$ is the set of <strong>natural numbers</strong>.</li><li>$\\mathbb{Z}=\\{\\ldots,-3,-2,-1,0,1,2,3,\\ldots\\}$ is the set of <strong>integers</strong>.</li><li>$\\mathbb{Q}$ is the set of <strong>rational numbers</strong>: numbers $p/q$ where $p\\in\\mathbb{Z}$, $q\\in\\mathbb{Z}$, and $q\\ne0$.</li><li>$\\mathbb{R}$ is the set of <strong>real numbers</strong>, the numbers represented by points on the number line. It includes rational numbers as well as irrational numbers such as $\\sqrt{2}$ and $\\pi$.</li></ul>"
    },

      "</div>" +
      "<p>The left-hand set $X$ is the <strong>domain</strong> (the inputs); the right-hand set $Y$ is the <strong>range</strong> (the pool of allowed outputs). We record the arrows with function notation: $f(0)=a$, $f(1)=a$, and $g(0)=a$, $g(1)=b$. Writing $f(0)=a$ just names the output that the arrow from $0$ points to. (We also write $0 \\mapsto a$, read &ldquo;$0$ maps to $a$,&rdquo; for that same arrow.)</p>"
    },

    { type: "prose", html:
      "<h2>One-to-one, onto, and one-to-one correspondences</h2>" +
      "<p>In general, a function may send two distinct elements of its domain to the same element of its range. For example, the <strong>floor function</strong> $\\lfloor\\,\\cdot\\,\\rfloor:\\mathbb{R}\\to\\mathbb{Z}$ rounds a real number down to the greatest integer no larger than it. It sends both $2.2$ and $2.3$ to $2$.</p>" +
      "<p>A function may also miss some elements of its range. For example, define $d:\\mathbb{N}\\to\\mathbb{N}$ by $d(x)=2x$. Its outputs are even, so no odd natural number is the value of $d(x)$ for any input $x$.</p>" +
      "<p>These examples raise two separate questions: does a function ever reuse an output, and does it reach every possible output? The following terms name those properties.</p>" +
      "<ul>" +
      "<li>A function is <strong>one-to-one</strong> (also called <strong>injective</strong>) if different inputs always land on different outputs — no output is used more than once.</li>" +
      "<li>A function is <strong>onto</strong> (also called <strong>surjective</strong>) if every element of the range is reached by some input — nothing in $Y$ is left out.</li>" +
      "</ul>" +
      "<p>A function can have either property without the other:</p>" +
      "<div style=\"display:flex;gap:28px;flex-wrap:wrap;justify-content:center;margin:16px 0\">" +
        "<figure style=\"margin:0;text-align:center\">" +
          "<svg viewBox=\"0 0 240 170\" width=\"220\" role=\"img\" aria-label=\"A function from a 2-element set to a 3-element set: 0 maps to a and 1 maps to b, while c is never reached. It is one-to-one but not onto.\">" +
          "<defs><marker id=\"ah-inj\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0L9 4.5L0 9z\" fill=\"currentColor\"/></marker></defs>" +
          "<ellipse cx=\"55\" cy=\"88\" rx=\"32\" ry=\"58\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\"0.45\"/>" +
          "<ellipse cx=\"185\" cy=\"88\" rx=\"32\" ry=\"64\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\"0.45\"/>" +
          "<text x=\"55\" y=\"20\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\" fill=\"currentColor\">X</text>" +
          "<text x=\"185\" y=\"20\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\" fill=\"currentColor\">Y</text>" +
          "<text x=\"55\" y=\"73\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">0</text>" +

          "<text x=\"185\" y=\"129\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">c</text>" +
          "<line x1=\"89\" y1=\"68\" x2=\"151\" y2=\"52\" stroke=\"currentColor\" marker-end=\"url(#ah-inj)\"/>" +

        "</figure>" +

    { type: "def", title: "One-to-one correspondence", html:
      "<p>A function that is <em>both</em> one-to-one and onto is a <strong>one-to-one correspondence</strong> (also called <strong>bijective</strong>, or a <strong>bijection</strong>). It pairs the domain and range perfectly: every input has its own output, and every output is used exactly once. Our function $g$ is a one-to-one correspondence between $\\{0,1\\}$ and $\\{a,b\\}$.</p>" +
      "<p>A perfect pairing like this forces the two sets to have the <em>same size</em> — an idea we will lean on later to count one collection by matching it up with another.</p>"
    },

    },
    { type: "prose", html:
      "<h2>Using bijections to compare sizes</h2>" +
      "<p>Two finite sets have the same cardinality exactly when a bijection pairs their members. For example, a bijection from $\\{a,b,c\\}$ to $\\{7,8,9\\}$ pairs three inputs with three outputs, so both sets have cardinality $3$.</p>" +
      "<p>The pairing itself establishes that the sets have the same size. We do not need to count the two sets separately first. This way of comparing sizes is especially useful for infinite sets, whose members cannot be counted to a final total.</p>" +
      "<p>We therefore use the same criterion for all sets: two sets have the <strong>same cardinality</strong> when there is a bijection between them.</p>"
    },
    { type: "prose", html:
      "<h2>The natural numbers and integers have the same cardinality</h2>" +
      "<p>The integers extend forever in both the positive and negative directions, while the natural numbers begin at $0$ and extend in only one direction. This can make the integers appear more numerous. The following pairing shows otherwise:</p>" +
      "<div style=\"overflow-x:auto;margin:16px 0\"><table style=\"margin:0 auto;border-collapse:collapse;text-align:center;min-width:560px\"><caption style=\"font-weight:600;margin-bottom:8px\">A pairing from $\\mathbb{N}$ to $\\mathbb{Z}$</caption><thead><tr><th scope=\"col\" style=\"padding:6px 10px;border-bottom:1px solid currentColor\">natural number $n$</th><th scope=\"col\" style=\"padding:6px 10px;border-bottom:1px solid currentColor\">$0$</th><th scope=\"col\" style=\"padding:6px 10px;border-bottom:1px solid currentColor\">$1$</th><th scope=\"col\" style=\"padding:6px 10px;border-bottom:1px solid currentColor\">$2$</th><th scope=\"col\" style=\"padding:6px 10px;border-bottom:1px solid currentColor\">$3$</th><th scope=\"col\" style=\"padding:6px 10px;border-bottom:1px solid currentColor\">$4$</th><th scope=\"col\" style=\"padding:6px 10px;border-bottom:1px solid currentColor\">$5$</th><th scope=\"col\" style=\"padding:6px 10px;border-bottom:1px solid currentColor\">$6$</th><th scope=\"col\" style=\"padding:6px 10px;border-bottom:1px solid currentColor\">$\\cdots$</th></tr></thead><tbody><tr><th scope=\"row\" style=\"padding:6px 10px\">integer paired with $n$</th><td style=\"padding:6px 10px\">$0$</td><td style=\"padding:6px 10px\">$1$</td><td style=\"padding:6px 10px\">$-1$</td><td style=\"padding:6px 10px\">$2$</td><td style=\"padding:6px 10px\">$-2$</td><td style=\"padding:6px 10px\">$3$</td><td style=\"padding:6px 10px\">$-3$</td><td style=\"padding:6px 10px\">$\\cdots$</td></tr></tbody></table></div>" +
      "<p>The pattern continues forever: $0$ is paired with $0$; each positive integer $k$ is paired with the natural number $2k-1$; and each negative integer $-k$ is paired with $2k$. Every natural number participates once, and every integer is reached once. This is a bijection, so $\\mathbb{N}$ and $\\mathbb{Z}$ have the same cardinality.</p>" +
      "<p>An infinite set is <strong>countable</strong> when it has a bijection with $\\mathbb{N}$. Equivalently, its members can be placed in a list with positions $0,1,2,\\ldots$ so that every member appears exactly once. The natural numbers and integers are both countable.</p>"
    },
    { type: "selectall", id: "countable-nz-check",
      prompt: "In the displayed pairing between $\\mathbb{N}$ and $\\mathbb{Z}$, select <strong>all</strong> true statements.",
      choices: [
        "The natural number $5$ is paired with the integer $3$.",
        "Every positive and negative integer eventually appears.",
        "The pairing shows that $\\mathbb{Z}$ has the same cardinality as $\\mathbb{N}$.",
        "The pairing fails because $\\mathbb{Z}$ contains negative numbers."
      ],
      answers: [0, 1, 2],
      hint: "A bijection must use every input once and reach every output once. Follow the alternating pattern $0,1,-1,2,-2,\\ldots$.",
      explain: "$5$ is paired with $3$. The list alternates positive and negative integers and eventually reaches every integer exactly once. The existence of that bijection establishes equal cardinality; negative values do not prevent a pairing."
    },
    { type: "prose", html:
      "<h2>The rational numbers are countable</h2>" +
      "<p>There are infinitely many rational numbers between any two distinct integers, so it may seem impossible to list them all. The key is to organize the list so that every rational number eventually receives a position.</p>" +
