  blocks: [
    { type: "prose", html:
      "<p>This reading develops two ideas that come up all across computer science: <strong>functions</strong> and <strong>counting</strong>. They are different ideas, but they fit together closely, and each leans on the other.</p>" +
      "<p>A <strong>function</strong> is how we describe an <em>assignment</em> — a rule that hands each input a single output. Placing each student in a dorm, sorting each file into a folder, giving each pixel a color, mapping each input of a program to the output it produces: every one of these is a function, and functions are among the most basic objects you will model with in this course. <strong>Counting</strong> is the art of saying how many objects of some kind there are <em>without</em> listing them all — how many passwords of a given length exist, how many ways a set of courses could be scheduled, how large a space of possibilities a program might have to search. </p>" +
      "<p>We begin by pinning down exactly what a function is (you met these in class as arrow diagrams), including the special kinds that matter later on: <em>one-to-one</em>, <em>onto</em>, and <em>one-to-one correspondences</em>. Then we build the two rules that organize almost all of our counting — the <strong>product rule</strong>, for choices made one after another, and the <strong>sum rule</strong>, for separate cases. Finally we put them to work: counting functions, counting strings, and seeing why one object, a string, can be read at the same time as a function and as a tuple.</p>" +
      "<p>We will also rely on the terminology of sets. A <strong>set</strong> is a collection of distinct objects. We write $\\{a, b, c\\}$ for the set containing the elements $a$, $b$, and $c$. We can assign a name to a set, like $A = \\{a, b, c\\}$. Note that unlike lists you have encountered in programming classes, which have order (or an index for each element), sets have no order. Similarly, unlike lists, which allow duplicate elements, sets only contain distinct elements. So the sets $\\{a, b, c\\}$, $\\{b, a, c\\}$, and $\\{a, b, a, c, a\\}$ are all the same set.</p>" +
      "<p>We write $x \\in A$ to say that $x$ is a member of set $A$, and we write $|A|$ (or sometimes $#A$) for the number of members of $A$, called its <strong>cardinality</strong> or size.</p>"
    },
    { type: "prose", html:
      "<h2>Functions</h2>" +
      "<p>Before we count functions, we should be sure what one <em>is</em> — this is the idea you built with arrow diagrams in class. A <strong>function</strong> is a rule that takes each input and returns a single output. We picture it with an <strong>arrow diagram</strong>: the inputs sit in a set on the left, the possible outputs in a set on the right, and we draw one arrow from each input to the output it is sent to.</p>" +
      "<p>Let $X = \\{0,1\\}$ and $Y = \\{a,b\\}$. Here are two functions of type $X \\to Y$ (read &ldquo;$X$ to $Y$&rdquo;):</p>" +

        "</figure>" +
      "</div>" +
      "<p>The left-hand set $X$ is the <strong>domain</strong> (the inputs); the right-hand set $Y$ is the <strong>range</strong> (the pool of allowed outputs). We record the arrows with function notation: $f(0)=a$, $f(1)=a$, and $g(0)=a$, $g(1)=b$. Writing $f(0)=a$ just names the output that the arrow from $0$ points to. (We also write $0 \\mapsto a$, read &ldquo;$0$ maps to $a$,&rdquo; for that same arrow.)</p>"
    },
    { type: "prose", html:
      "<h2>When a diagram is <em>not</em> a function</h2>" +
      "<p>Two requirements make an arrow diagram a function of type $X \\to Y$: <strong>every</strong> input must have an arrow, and each input must have <strong>exactly one</strong>. Break either requirement and it is not a function of that type.</p>" +
      "<div style=\"display:flex;gap:28px;flex-wrap:wrap;justify-content:center;margin:16px 0\">" +
        "<figure style=\"margin:0;text-align:center\">" +
          "<svg viewBox=\"0 0 240 160\" width=\"220\" role=\"img\" aria-label=\"Diagram s from X to Y. The input 0 has an arrow to b, but the input 1 has no arrow, so s is not a function.\">" +

          "<text x=\"185\" y=\"20\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\" fill=\"currentColor\">Y</text>" +
          "<text x=\"55\" y=\"64\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">0</text>" +
          "<text x=\"55\" y=\"106\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">1</text>" +
          "<text x=\"185\" y=\"64\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">a</text>" +
          "<text x=\"185\" y=\"106\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">b</text>" +

          "</svg>" +
          "<figcaption style=\"font-size:14px;margin-top:2px\">$s$ is <strong>not</strong> a function: $1$ has no arrow</figcaption>" +

        "<figure style=\"margin:0;text-align:center\">" +
          "<svg viewBox=\"0 0 240 160\" width=\"220\" role=\"img\" aria-label=\"Diagram t from X to Y. The input 0 has two arrows, one to a and one to b, and the input 1 has no arrow, so t is not a function.\">" +
          "<defs><marker id=\"ah-t\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0L9 4.5L0 9z\" fill=\"currentColor\"/></marker></defs>" +
          "<ellipse cx=\"55\" cy=\"82\" rx=\"32\" ry=\"56\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\"0.45\"/>" +
          "<ellipse cx=\"185\" cy=\"82\" rx=\"32\" ry=\"56\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\"0.45\"/>" +
          "<text x=\"55\" y=\"20\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\" fill=\"currentColor\">X</text>" +

          "<text x=\"55\" y=\"64\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">0</text>" +
          "<text x=\"55\" y=\"106\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">1</text>" +
          "<text x=\"185\" y=\"64\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">a</text>" +
          "<text x=\"185\" y=\"106\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">b</text>" +
          "<line x1=\"89\" y1=\"59\" x2=\"151\" y2=\"59\" stroke=\"currentColor\" marker-end=\"url(#ah-t)\"/>" +
          "<line x1=\"89\" y1=\"59\" x2=\"151\" y2=\"101\" stroke=\"currentColor\" marker-end=\"url(#ah-t)\"/>" +
          "</svg>" +
          "<figcaption style=\"font-size:14px;margin-top:2px\">$t$ is <strong>not</strong> a function: $0$ has two arrows</figcaption>" +
        "</figure>" +
      "</div>" +
      "<p>Mapping $s$ leaves the input $1$ unmapped. Mapping $t$ fails twice over: it sends the single input $0$ to <em>two</em> outputs, and it also leaves $1$ unmapped. A function never leaves an input unassigned and never sends one input to two different outputs.</p>" +
      "<p>Two things that <em>are</em> allowed are worth noticing. Function $f$ above sends two different inputs to the same output — that is fine, because the requirements constrain each <em>input</em>, not each output. And an output may receive no arrow at all (nothing maps to $b$ under $f$).</p>"
    },
    { type: "def", title: "Function", html:
      "<p>A <strong>function</strong> $f : X \\to Y$ assigns to <em>each</em> element $x$ of the domain $X$ exactly one element $f(x)$ of the range $Y$ — nothing left unassigned, nothing assigned two values. The output $f(x)$ is the <strong>value</strong> of $f$ at $x$. (How <em>many</em> functions of a given type there are, we count a little later — once we have the product rule.)</p>"

    { type: "prose", html:
      "<h2>One-to-one, onto, and one-to-one correspondences</h2>" +
      "<p>Some functions are especially well-behaved, and in class you gave these behaviors names. Look again at the two functions we started with. Function $g$ (which sent $0 \\mapsto a$ and $1 \\mapsto b$) never reuses an output <em>and</em> reaches every element of $Y$. Function $f$ (which sent both inputs to $a$) does neither: it repeats the output $a$, and it misses $b$ entirely. These two behaviors are worth separating.</p>" +
      "<ul>" +
      "<li>A function is <strong>one-to-one</strong> (also called <strong>injective</strong>) if different inputs always land on different outputs — no output is used more than once.</li>" +
      "<li>A function is <strong>onto</strong> (also called <strong>surjective</strong>) if every element of the range is reached by some input — nothing in $Y$ is left out.</li>" +
      "</ul>" +
      "<p>The two properties are independent — a function can have either one without the other — so it helps to see each in isolation:</p>" +
      "<div style=\"display:flex;gap:28px;flex-wrap:wrap;justify-content:center;margin:16px 0\">" +
        "<figure style=\"margin:0;text-align:center\">" +
          "<svg viewBox=\"0 0 240 170\" width=\"220\" role=\"img\" aria-label=\"A function from a 2-element set to a 3-element set: 0 maps to a and 1 maps to b, while c is never reached. It is one-to-one but not onto.\">" +
          "<defs><marker id=\"ah-inj\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0L9 4.5L0 9z\" fill=\"currentColor\"/></marker></defs>" +

          "<ellipse cx=\"185\" cy=\"88\" rx=\"32\" ry=\"64\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\"0.45\"/>" +

          "<text x=\"185\" y=\"20\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\" fill=\"currentColor\">Y</text>" +
          "<text x=\"55\" y=\"73\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">0</text>" +
          "<text x=\"55\" y=\"113\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">1</text>" +
          "<text x=\"185\" y=\"57\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">a</text>" +
          "<text x=\"185\" y=\"93\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">b</text>" +
          "<text x=\"185\" y=\"129\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">c</text>" +
          "<line x1=\"89\" y1=\"68\" x2=\"151\" y2=\"52\" stroke=\"currentColor\" marker-end=\"url(#ah-inj)\"/>" +
          "<line x1=\"89\" y1=\"108\" x2=\"151\" y2=\"88\" stroke=\"currentColor\" marker-end=\"url(#ah-inj)\"/>" +
          "</svg>" +
          "<figcaption style=\"font-size:14px;margin-top:2px\">One-to-one but <em>not</em> onto: no output repeats, but $c$ is never reached.</figcaption>" +
        "</figure>" +
        "<figure style=\"margin:0;text-align:center\">" +
          "<svg viewBox=\"0 0 240 170\" width=\"220\" role=\"img\" aria-label=\"A function from a 3-element set to a 2-element set: 0 maps to a, 1 maps to b, and 2 maps to b. Every output is reached but b is reached twice. It is onto but not one-to-one.\">" +
          "<defs><marker id=\"ah-surj\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0L9 4.5L0 9z\" fill=\"currentColor\"/></marker></defs>" +
          "<ellipse cx=\"55\" cy=\"88\" rx=\"32\" ry=\"64\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\"0.45\"/>" +
          "<ellipse cx=\"185\" cy=\"88\" rx=\"32\" ry=\"58\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\"0.45\"/>" +

          "<text x=\"185\" y=\"20\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\" fill=\"currentColor\">Y</text>" +
          "<text x=\"55\" y=\"57\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">0</text>" +
          "<text x=\"55\" y=\"93\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">1</text>" +
          "<text x=\"55\" y=\"129\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">2</text>" +
          "<text x=\"185\" y=\"73\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">a</text>" +
          "<text x=\"185\" y=\"113\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">b</text>" +
          "<line x1=\"89\" y1=\"52\" x2=\"151\" y2=\"68\" stroke=\"currentColor\" marker-end=\"url(#ah-surj)\"/>" +

    { type: "def", title: "One-to-one correspondence", html:
      "<p>A function that is <em>both</em> one-to-one and onto is a <strong>one-to-one correspondence</strong> (also called <strong>bijective</strong>, or a <strong>bijection</strong>). It pairs the domain and range perfectly: every input has its own output, and every output is used exactly once. Our function $g$ is a one-to-one correspondence between $\\{0,1\\}$ and $\\{a,b\\}$.</p>" +
      "<p>A perfect pairing like this forces the two sets to have the <em>same size</em> — an idea we will lean on later to count one collection by matching it up with another.</p>"
    },

      choices: [

        "It is a one-to-one correspondence (a bijection).",

      explain: "$g$ sends $0$ and $1$ to <em>different</em> outputs (one-to-one), and both $a$ and $b$ are reached (onto), so it is a one-to-one correspondence. It does not send two inputs to the same output — that was $f$, not $g$."
    },
    { type: "prose", html:
      "<h2>Ordered pairs and the Cartesian product</h2>" +
      "<p>Suppose we pick one section from $C = \\{c_1, c_2, c_3\\}$ and pair it with one professor from $P = \\{\\text{Bowers}, \\text{Lam}, \\text{Molloy}, \\text{Weikle}\\}$. Each outcome is an <strong>ordered pair</strong> $(c, p)$: the first entry is the section, the second is the professor. The set of <em>all</em> such pairs is the <strong>Cartesian product</strong> $C \\times P = \\{(c,p) : c \\in C,\\ p \\in P\\}$.</p>" +
      "<p><em>Order is part of the pair.</em> A pair in $P \\times C$ looks like $(\\text{Bowers}, c_1)$ — professor first — so $C \\times P$ and $P \\times C$ are different sets of pairs, even though you could pair them up by reversing each pair. Building a pair takes two independent choices, so $|C \\times P| = |C| \\cdot |P| = 3 \\cdot 4 = 12$.</p>"
    },
    { type: "shortnum", id: "q1",
      prompt: "Let $A$ have $5$ elements and $B$ have $3$ elements. How many ordered pairs are in $A \\times B$?",
      answer: 15,
      placeholder: "a whole number",
      hint: "Two independent choices: the first entry from $A$, the second from $B$. Multiply.",
      explain: "$|A \\times B| = |A| \\cdot |B| = 5 \\cdot 3 = 15$."
    },
    { type: "def", title: "Tuples and the product rule", html:
      "<p>An <strong>$n$-tuple</strong> is an ordered list $(a_1, a_2, \\dots, a_n)$ whose first entry is chosen from a set $A_1$, second from $A_2$, and so on. The Cartesian product $A_1 \\times A_2 \\times \\cdots \\times A_n$ is the set of all such tuples.</p>" +
      "<p><strong>Product rule.</strong> When each member of a collection is specified by making a sequence of choices — the first with $n_1$ options, the second with $n_2$, and so on — and the procedure produces every member exactly once, the number of members is $n_1 \\cdot n_2 \\cdots n_k$. In particular $|A_1 \\times \\cdots \\times A_n| = |A_1| \\cdot |A_2| \\cdots |A_n|$.</p>"
    },
    { type: "shortnum", id: "q2",
      prompt: "A password is two letters from $\\{A,B,C,D,E\\}$ (repeats allowed) followed by one digit from $\\{1,2,3\\}$. How many passwords are there?",
      answer: 75,
      placeholder: "a whole number",
      hint: "Three independent choices: first letter, second letter, digit. Multiply the option counts.",
      explain: "$5 \\cdot 5 \\cdot 3 = 75$ — one factor per position."
    },
    { type: "prose", html:
      "<h2>Counting functions</h2>" +
      "<p>Why would we want to count functions? Because a function is exactly what records an <em>assignment</em>: sorting each of your files into one of several folders, placing each student in a dorm, handing each of the day&rsquo;s jobs to one of the servers that could run it. Counting the functions of a given type answers the question &ldquo;how many different ways could that assignment turn out?&rdquo;</p>" +
      "<p>So suppose we want to count the functions from $X = \\{0,1\\}$ to $Y = \\{a,b\\}$. It turns out this is the product rule in disguise. To <em>build</em> such a function, go through the inputs one at a time and choose an output for each. The choices are <strong>independent</strong>: sending $0$ somewhere uses up none of the options for $1$, since a function is free to reuse an output. That is two stages with two options each, $2 \\cdot 2 = 4$ functions in all — the $f$ and $g$ above, plus the two that send $0 \\mapsto b$.</p>" +
      "<p>One stage per input, with $|Y|$ options at every stage, so a domain of size $|X|$ into a range of size $|Y|$ gives</p>" +
      "<p style=\"text-align:center\">$\\underbrace{|Y| \\cdot |Y| \\cdots |Y|}_{|X| \\text{ inputs}} = |Y|^{\\,|X|}$</p>" +
      "<p>functions. For a concrete case, the number of ways to color a row of $4$ pixels using $3$ colors is just the number of functions from the $4$ positions to the $3$ colors: $3^4 = 81$. And from a $2$-element set into a $3$-element set there are $3^2 = 9$; from a $3$-element set into a $2$-element set there are $2^3 = 8$. Watch the roles: the size of the <em>domain</em> is the exponent, because each input is one independent choice.</p>"
